[project]
name = "claude-code-classifier"
version = "0.1.0"
description = "PreToolUse hook classifier for Claude Code: deterministic rules + Claude Haiku 4.5 fallback"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "littlefogcat" }]
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "PyYAML>=6.0.2",
    "httpx>=0.27.2",
    "anthropic>=0.40.0",
    "tenacity>=9.0.0",
    "anyio>=4.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "respx>=0.21.1",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[project.scripts]
classifier = "classifier.main:run"
hook-bridge = "classifier.bridge.hook_bridge:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/classifier"]

[tool.pytest.ini_options]
# asyncio_mode = "auto"  # using stdlib asyncio instead of pytest-asyncio\ntestpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.coverage.run]
source = ["src/classifier"]
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false